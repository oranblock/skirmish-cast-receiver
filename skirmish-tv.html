<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SKIRMISH | TACTICAL TV ARENA BROADCAST</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05080f; font-family: 'Courier New', monospace; color: #00ff88; }
        #overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            background: radial-gradient(circle, #0a1e14 0%, #05080f 100%);
            transition: opacity 1.5s ease;
        }
        .hud-border {
            border: 2px solid #00ff88; padding: 40px; border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.25); background: rgba(5,10,20,0.92);
            text-align: center; max-width: 85%; backdrop-filter: blur(12px);
        }
        h1 { letter-spacing: 12px; font-size: 52px; margin: 0 0 16px 0; text-shadow: 0 0 20px #00ff88; color: #fff; }
        .status { font-size: 20px; margin-bottom: 24px; color: #00f0ff; font-weight: bold; }
        
        /* 🎥 LIVE ARENA CAMERA RADAR DISPLAY */
        .radar-box {
            width: 320px; height: 180px; margin: 0 auto 20px auto;
            border: 1px solid rgba(0, 255, 136, 0.4); border-radius: 8px;
            background: #000; position: relative; overflow: hidden;
        }
        #radarCanvas { width: 100%; height: 100%; }
        
        #qr-container { background: #fff; padding: 12px; border-radius: 8px; display: none; margin: 16px auto; width: 180px; height: 180px; }
        #game-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; z-index: 50; }
        
        .download-hint {
            font-size: 13px; color: #ffaa00; font-weight: bold; margin-top: 14px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="hud-border">
            <h1>SKIRMISH TV</h1>
            <div id="status-text" class="status">AWAITING TACTICAL UPLINK...</div>
            
            <!-- 🎥 LIVE ARENA CAMERA RADAR -->
            <div class="radar-box">
                <canvas id="radarCanvas"></canvas>
            </div>

            <!-- DYNAMIC QR CODE FOR SMART PHONE SCAN -->
            <div id="qr-container"><canvas id="qr"></canvas></div>
            <div id="join-hint" style="display:none; font-weight:bold; margin-top:16px; color:#fff;">SCAN QR TO JOIN BATTLE ON MOBILE</div>
            <div class="download-hint">📲 SCANNING AUTO-OPENS APP OR DOWNLOADS LATEST APK</div>
        </div>
    </div>
    
    <iframe id="game-frame" allow="autoplay"></iframe>

    <script>
        const statusEl = document.getElementById('status-text');
        const qrContainer = document.getElementById('qr-container');
        const hintEl = document.getElementById('join-hint');
        const frameEl = document.getElementById('game-frame');
        const overlayEl = document.getElementById('overlay');

        function triggerHandshake(host) {
            console.log("Handshake starting for:", host);
            statusEl.innerHTML = "TACTICAL UPLINK ESTABLISHED: " + host;

            // QR Code points to the Smart Battle Launcher (Auto-open App OR Download APK)
            const smartLink = `https://oranblock.github.io/skirmish-cast-receiver/battle_launcher.html?host=${encodeURIComponent(host)}`;
            
            try {
                new QRious({
                    element: document.getElementById('qr'),
                    value: smartLink,
                    size: 180, padding: 0
                });
                qrContainer.style.display = 'block';
                hintEl.style.display = 'block';
            } catch(e) { console.error("QR Generation error:", e); }

            // 🚀 CACHE BUSTER: Stream live TV spectator view
            const tvUrl = "http://" + host + "/tv?t=" + Date.now();
            frameEl.src = tvUrl;

            setTimeout(() => {
                overlayEl.style.opacity = "0";
                frameEl.style.display = "block";
                setTimeout(() => { overlayEl.style.display = "none"; }, 1500);
            }, 8000);
        }

        // 🎨 LIVE TV ARENA RADAR SWEEP ANIMATION
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        let angle = 0;

        function drawRadar() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = Math.min(cx, cy) - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Radar rings
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2); ctx.stroke();

            // Sweep Beam
            angle += 0.04;
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
            ctx.stroke();

            ctx.fillStyle = '#00f0ff';
            ctx.font = '10px Courier New';
            ctx.fillText('CAMERA: ARENA RADAR', 10, 16);

            requestAnimationFrame(drawRadar);
        }
        drawRadar();

        // 🔐 GOOGLE CAST CAF V3 RECEIVER (WITH SAFE PARSING)
        try {
            const context = cast.framework.CastReceiverContext.getInstance();
            const namespace = 'urn:x-cast:com.da3dee3.skirmish';
            
            context.addCustomMessageListener(namespace, (event) => {
                let data = event.data;
                if (typeof data === 'string') {
                    try { data = JSON.parse(data); } catch(err) {}
                }
                if (data && data.host) {
                    triggerHandshake(data.host);
                }
            });

            context.start({ disableIdleTimeout: true });
        } catch(e) {
            console.warn("Not running in Cast Receiver container:", e);
        }
    </script>
</body>
</html>
